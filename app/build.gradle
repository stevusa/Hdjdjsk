plugins {
    id 'com.android.application'
}

android {
    namespace 'rs.stevusa.airboxreceiver'
    compileSdk 37

    defaultConfig {
        applicationId 'rs.stevusa.airboxreceiver'
        minSdk 26
        targetSdk 37
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
